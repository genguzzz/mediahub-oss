# 影库 backend. Adapt: server_name, TLS certificate, listen address (or terminate TLS elsewhere).
server {
    listen 443 ssl http2;
    server_name media.example.com;
    ssl_certificate     /etc/ssl/media.example.com.crt;
    ssl_certificate_key /etc/ssl/media.example.com.key;
    client_max_body_size 60m;
    # Expo Updates assets: immutable files written once per update.
    location /updates/assets/ {
        alias /opt/mediahub/updates/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip on;
        gzip_types application/javascript application/octet-stream application/json;
        try_files $uri =404;
    }
    location / {
        proxy_pass http://127.0.0.1:8793;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        gzip on;
        gzip_types application/json;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name media.example.com;
    return 301 https://$host$request_uri;
}
