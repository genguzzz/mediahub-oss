# Emby front (emby.example.com:8920) -> Emby:8096; playback paths -> go-emby2openlist:8095.
#  - TLS, HTTP/2, gzip and the image cache live here; browse APIs go straight to Emby
#  - only PlaybackInfo / stream / original / master / main.m3u8 / download / progress go to ge2o for the 115 302
#  - adapt: server_name, certificate paths, upstream addresses (see docs/DEPLOY_PROMPT.md)

proxy_cache_path /var/cache/nginx/emby-img levels=1:2 keys_zone=emby_img:8m
                 max_size=2g inactive=60d use_temp_path=off;

upstream emby_origin {
    server 127.0.0.1:8096;
    keepalive 16;
}

upstream emby_ge2o {
    server 127.0.0.1:8095;
    keepalive 8;
}

map $http_upgrade $emby_conn_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 8920 ssl http2 default_server;
    listen [::]:8920 ssl http2 default_server;
    server_name emby.example.com;

    ssl_certificate     /etc/nginx/conf.d/ddns.crt;
    ssl_certificate_key /etc/nginx/conf.d/ddns.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:emby_ssl:2m;
    ssl_session_timeout 1d;
    keepalive_timeout   120s;
    client_max_body_size 100m;

    # Emby 的 JSON 自己会压缩；这里补上 web 静态资源和 Emby 没压的类型
    gzip_types application/json application/javascript text/javascript text/css application/xml text/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 4;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # websocket
    location ~* /embywebsocket {
        proxy_pass http://emby_origin;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $emby_conn_upgrade;
        proxy_read_timeout 86400s;
    }

    # 字幕 URL 里带 /Stream.srt，要先于 stream 规则匹配，直接给 Emby
    location ~* /videos/[^/]+/[^/]+/subtitles/ {
        proxy_pass http://emby_origin;
    }

    # 播放：交给 ge2o 解析 strm -> OpenList -> 115 CDN 直链，302 给客户端
    location ~* (/items/[^/]+/playbackinfo|/(videos|audio)/[^/]+/(stream|universal|original|master|main\.m3u8)|/videos/proxy_(playlist|ts|subtitle)|/items/[^/]+/download|/sync/jobitems/[^/]+/file|/sessions/playing/(stopped|progress)) {
        proxy_pass http://emby_ge2o;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 图片：按完整 URL（含 tag/尺寸/质量）缓存到 SSD，Emby 换图时 tag 会变
    location ~* /items/[^/]+/images/ {
        proxy_pass http://emby_origin;
        proxy_cache emby_img;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        expires 30d;
        add_header X-Cache $upstream_cache_status;
    }

    location / {
        proxy_pass http://emby_origin;
    }
}
